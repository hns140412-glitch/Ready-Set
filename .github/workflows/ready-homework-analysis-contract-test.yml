name: Ready Homework Analysis Contract

on:
  push:
    branches:
      - runtime-session-bridge-2026-09-10
    paths:
      - 'netlify/functions/homework-analysis.mjs'
      - 'ready-homework-analysis-bridge-v1.js'
      - 'ready-parent-capture-intake-v1.js'
      - 'ready-stage-c.js'
      - 'ready-stage-e.js'
      - 'ready-stage-f.js'
      - 'ready-foundation-v1.js'
      - 'ready-foundation-control-v1.js'
      - 'sw.js'
      - 'VERSION.json'
      - 'tests/ready-homework-analysis-contract.mjs'
      - 'tests/ready-homework-analysis-parent-confirm-integration.mjs'
      - 'tests/ready-homework-parent-confirm-planner-e2e.mjs'
      - '.github/workflows/ready-homework-analysis-contract-test.yml'
  pull_request:
    paths:
      - 'netlify/functions/homework-analysis.mjs'
      - 'ready-homework-analysis-bridge-v1.js'
      - 'ready-parent-capture-intake-v1.js'
      - 'ready-stage-c.js'
      - 'ready-stage-e.js'
      - 'ready-stage-f.js'
      - 'ready-foundation-v1.js'
      - 'ready-foundation-control-v1.js'
      - 'sw.js'
      - 'VERSION.json'
      - 'tests/ready-homework-analysis-contract.mjs'
      - 'tests/ready-homework-analysis-parent-confirm-integration.mjs'
      - 'tests/ready-homework-parent-confirm-planner-e2e.mjs'
      - '.github/workflows/ready-homework-analysis-contract-test.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Homework analysis contract
        run: node tests/ready-homework-analysis-contract.mjs
      - name: Analysis candidate to parent confirmation integration
        run: node tests/ready-homework-analysis-parent-confirm-integration.mjs
      - name: Parent-confirmed homework to Planner E2E
        run: node tests/ready-homework-parent-confirm-planner-e2e.mjs
