name: Ready Integration CI

on:
  push:
    branches:
      - main
      - taky/ready-integration-v01
      - taky/ready-learning-authority-reconcile-2026-10-02
  pull_request:
    branches:
      - main

jobs:
  semantic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Existing planner contract
        run: node .github/scripts/ready_planner_contract_test.js
      - name: Assignment and Learning Master contract
        run: node .github/scripts/ready_learning_master_contract_test.js
      - name: Ready learning authority reconciliation
        run: node tests/ready-learning-authority-reconcile.test.js
      - name: Ready vs central Learning authority boundary
        run: node tests/learning-authority-boundary.test.js
      - name: Carry escalation routing boundary
        run: node tests/carry-escalation-routing.test.js
      - name: Ready→Snap sourced run scope and hostile replay contract
        run: node tests/ready-snap-run-scope.test.js
      - name: Central observation handoff I/O contract
        run: node tests/central-observation-handoff.test.js
      - name: Central Learning roundtrip
        run: node tests/central-learning-roundtrip.test.js
      - name: Central intent to Planner allocation
        run: node tests/central-intent-to-planner.test.js

  learning-master-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Learning Master and official mapping contract
        run: node .github/scripts/ready_learning_master_contract_test.js
