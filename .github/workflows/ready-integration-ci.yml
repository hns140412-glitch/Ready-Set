name: Ready Integration CI

on:
  push:
    branches:
      - taky/ready-integration-v01
  pull_request:
    branches:
      - main

jobs:
  semantic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Official unit-map contract
        run: node .github/scripts/ready_unit_map_contract_test.js
      - name: Existing planner contract
        run: node .github/scripts/ready_planner_contract_test.js
      - name: Assignment and Learning Master contract
        run: node .github/scripts/ready_learning_master_contract_test.js
