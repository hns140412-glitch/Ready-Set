name: Ready Integration CI

on:
  push:
    branches:
      - main
      - taky/ready-integration-v01
      - taky/learning-app-family-p1-2026-09-21
  pull_request:
    branches:
      - main

jobs:
  semantic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Learning App Family return-state regression
        run: node tests/learning-app-family-return-contract.test.js
      - name: Ready learning-context producer regression
        run: node tests/learning-context-producer-contract.test.js
      - name: Atomic single Planner IN_PROGRESS regression
        run: node tests/planner-single-active-runtime.test.js
      - name: Existing planner contract
        run: node .github/scripts/ready_planner_contract_test.js
      - name: Assignment and Learning Master contract
        run: node .github/scripts/ready_learning_master_contract_test.js

  learning-master-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Learning Master and official mapping contract
        run: node .github/scripts/ready_learning_master_contract_test.js
