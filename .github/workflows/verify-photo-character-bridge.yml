name: Verify PHOTO character bridge

on:
  push:
    branches: [runtime-session-bridge-2026-09-10]
    paths: ['.github/workflows/verify-photo-character-bridge.yml']

permissions:
  contents: write

jobs:
  patch-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-session-bridge-2026-09-10
          fetch-depth: 0
      - name: Fix tap lifecycle in both identity owners
        run: echo '' | base64 -d | python
      - name: Owner syntax and parity
        run: |
          node --check ready-onboarding-identity-v1.js
          node --check ready-onboarding-identity-v2.js
          cmp ready-onboarding-identity-v1.js ready-onboarding-identity-v2.js
      - name: Commit product fix before browser regression
        run: |
          git config user.name "TAKY Actions"
          git config user.email "actions@users.noreply.github.com"
          git add ready-onboarding-identity-v1.js ready-onboarding-identity-v2.js
          if ! git diff --cached --quiet; then
            git commit -m "Complete PHOTO tap before character transition"
            git push origin HEAD:runtime-session-bridge-2026-09-10
          fi
      - name: Static first-run contract
        run: node tests/ready-first-run-parent-activation-contract.mjs
      - name: Install Playwright package only
        run: npm install --no-save playwright@latest
      - name: Run bounded mobile browser regression with system Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          timeout 150s node tests/ready-first-journey-transition.mjs "$PWD/node_modules/playwright/index.mjs" "$CHROME"
