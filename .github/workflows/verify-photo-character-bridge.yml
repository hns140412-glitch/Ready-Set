name: Verify PHOTO character bridge

on:
  push:
    branches: [runtime-session-bridge-2026-09-10]
    paths: ['.github/workflows/verify-photo-character-bridge.yml']

permissions:
  contents: write

jobs:
  patch-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-session-bridge-2026-09-10
          fetch-depth: 0
      - name: Give staged mood UI explicit CHARACTER ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          mood = Path('ready-mood-direction-v2.js')
          s = mood.read_text(encoding='utf-8')
          anchor = "new MutationObserver(()=>paint()).observe(document.documentElement,{subtree:true,childList:true});"
          export = "globalThis.ReadyMoodDirectionV2UI=Object.freeze({paint:()=>paint(true)});"
          if export not in s:
              if anchor not in s:
                  raise SystemExit('mood UI export anchor missing')
              s = s.replace(anchor, export+'\n'+anchor, 1)
          mood.write_text(s, encoding='utf-8')

          stage = Path('ready-stage-c.js')
          s = stage.read_text(encoding='utf-8')
          old = """  const mountCandidate=()=>{\n    installReferenceStyle();\n    const mount=document.querySelector('#readyCharacterCandidateMount'),candidate=window.ReadyCharacterCandidateV1;\n    if(!mount||!candidate)return false;\n    try{if(candidate.mount)candidate.mount(mount);else if(candidate.render)candidate.render(mount);else return false}catch(error){console.error('[Ready Candidate Mount]',error);return false}\n    return mount.dataset.candidateUi===candidate.version || !!mount.querySelector('[data-mood-tile],[data-candidate-action],.ccMaking,.ccReady,.ccRefine,.ccIntro');\n  };"""
          new = """  const mountCandidate=()=>{\n    installReferenceStyle();\n    const mount=document.querySelector('#readyCharacterCandidateMount');\n    if(!mount)return false;\n    const moodCount=safeRead().characterMoodDirections?.selections?.length||0;\n    if(moodCount<3&&window.ReadyMoodDirectionV2UI?.paint){\n      window.ReadyMoodDirectionV2UI.paint();\n      return !!mount.querySelector('.takyConsult');\n    }\n    const candidate=window.ReadyCharacterCandidateV1;\n    if(!candidate)return false;\n    try{if(candidate.mount)candidate.mount(mount);else if(candidate.render)candidate.render(mount);else return false}catch(error){console.error('[Ready Candidate Mount]',error);return false}\n    return mount.dataset.candidateUi===candidate.version || !!mount.querySelector('[data-mood-tile],[data-candidate-action],.ccMaking,.ccReady,.ccRefine,.ccIntro');\n  };"""
          if old not in s and new not in s:
              raise SystemExit('stage candidate owner anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace("2026.09.13-stage-first-journey-parent-setup-v3", "2026.09.13-stage-first-journey-parent-setup-v4-mood-owner")
          stage.write_text(s, encoding='utf-8')
          PY
      - name: Syntax
        run: |
          node --check ready-mood-direction-v2.js
          node --check ready-stage-c.js
          node --check tests/ready-first-journey-transition.mjs
      - name: Commit product ownership fix
        run: |
          git config user.name "TAKY Actions"
          git config user.email "actions@users.noreply.github.com"
          git add ready-mood-direction-v2.js ready-stage-c.js
          if ! git diff --cached --quiet; then
            git commit -m "Give staged mood UI explicit CHARACTER ownership"
            git push origin HEAD:runtime-session-bridge-2026-09-10
          fi
      - name: Static first-run contract
        run: node tests/ready-first-run-parent-activation-contract.mjs
      - name: Install Playwright package only
        run: npm install --no-save playwright@latest
      - name: Run bounded mobile browser regression
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          timeout 150s node tests/ready-first-journey-transition.mjs "$PWD/node_modules/playwright/index.mjs" "$CHROME"
