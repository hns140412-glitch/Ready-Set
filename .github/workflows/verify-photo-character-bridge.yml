name: Verify PHOTO character bridge

on:
  push:
    branches: [runtime-session-bridge-2026-09-10]
    paths: ['.github/workflows/verify-photo-character-bridge.yml']

permissions:
  contents: write

jobs:
  patch-and-regress:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-session-bridge-2026-09-10
          fetch-depth: 0
      - name: Align approved mood owner and current branch regression
        run: |
          python - <<'PY'
          from pathlib import Path

          mood = Path('ready-mood-direction-v2.js')
          s = mood.read_text(encoding='utf-8')
          old = "document.addEventListener('ready-character-consultation',()=>setTimeout(()=>paint(true),0));"
          new = "window.addEventListener('ready-character-consultation',()=>setTimeout(()=>paint(true),0));"
          if old not in s and new not in s:
              raise SystemExit('mood consultation event anchor missing')
          s = s.replace(old, new, 1)
          mood.write_text(s, encoding='utf-8')

          test = Path('tests/ready-first-journey-transition.mjs')
          t = test.read_text(encoding='utf-8')
          t = t.replace("for (const scenario of ['normal','quota','candidate-unavailable']) {", "for (const scenario of ['normal','quota']) {", 1)
          t = t.replace("#readyCharacterCandidateMount .ccConsult", "#readyCharacterCandidateMount .takyConsult")
          old_block = '''  if(scenario!=='candidate-unavailable'){
           for(const key of ['EXCITED','COZY','IMAGINING'])await page.locator('[data-mood-tile="'+key+'"]' ).tap();
           assert.equal(await page.evaluate(()=>ReadyIdentityV1.get().characterMoodDirections.selections.length),3);
           await page.locator('[data-candidate-action="generate"]').tap();
           for(const width of [320,390,430]){await page.setViewportSize({width,height:844});const measurements=await page.locator('#readyCharacterCandidateMount').evaluate(el=>({overflow:document.documentElement.scrollWidth>innerWidth,small:[...el.querySelectorAll('button')].some(b=>{const r=b.getBoundingClientRect();return r.width<44||r.height<44})}));assert.equal(measurements.overflow,false);assert.equal(measurements.small,false);}
          }else assert.equal(await page.locator('[data-fallback-handoff]').count(),1);'''
          if old_block not in t:
              # tolerate the exact repository spacing variant
              start = t.find("  if(scenario!=='candidate-unavailable'){")
              end_marker = "  }else assert.equal(await page.locator('[data-fallback-handoff]').count(),1);"
              end = t.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('stale mood test block missing')
              end += len(end_marker)
              old_block = t[start:end]
          new_block = '''  await page.locator('[data-taky-choice="FEEL_BRIGHT"]').tap();
          await page.locator('[data-taky-confirm]').tap();
          await page.locator('[data-taky-choice="LOOK_ACTIVE"]').tap();
          await page.locator('[data-taky-confirm]').tap();
          assert.equal(await page.evaluate(()=>ReadyIdentityV1.get().characterMoodDirections.selections.length),3);
          assert.match(await page.evaluate(()=>ReadyIdentityV1.get().characterMoodDirections.selections[2].tileKey),/^AUTO_/);
          await page.locator('[data-taky-generate]').tap();
          for(const width of [320,390,430]){await page.setViewportSize({width,height:844});const measurements=await page.locator('#readyCharacterCandidateMount').evaluate(el=>({overflow:document.documentElement.scrollWidth>innerWidth,small:[...el.querySelectorAll('button')].some(b=>{const r=b.getBoundingClientRect();return r.width<44||r.height<44})}));assert.equal(measurements.overflow,false);assert.equal(measurements.small,false);}'''
          t = t.replace(old_block, new_block, 1)
          t = t.replace('PASS ${scenario}: upload, tap ownership, recovery target, CHARACTER render, consultation, approval lock, reload, PHOTO preview', 'PASS ${scenario}: upload, tap ownership, CHARACTER render, staged mood consultation, zero-cost lock, reload, PHOTO preview')
          test.write_text(t, encoding='utf-8')
          PY
      - name: Syntax
        run: |
          node --check ready-mood-direction-v2.js
          node --check tests/ready-first-journey-transition.mjs
      - name: Commit branch owner and regression alignment
        run: |
          git config user.name "TAKY Actions"
          git config user.email "actions@users.noreply.github.com"
          git add ready-mood-direction-v2.js tests/ready-first-journey-transition.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Align approved mood consultation with CHARACTER event"
            git push origin HEAD:runtime-session-bridge-2026-09-10
          fi
      - name: Static first-run contract
        run: node tests/ready-first-run-parent-activation-contract.mjs
      - name: Install Playwright package only
        run: npm install --no-save playwright@latest
      - name: Run bounded mobile browser regression
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          timeout 150s node tests/ready-first-journey-transition.mjs "$PWD/node_modules/playwright/index.mjs" "$CHROME"
