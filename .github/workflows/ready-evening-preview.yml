name: Ready Evening Core Use Preview
on:
  push:
    branches:
      - preview/evening-core-use-20260928
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-first-week-day-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check preview source syntax
        run: node --check ready-evening-quickstart.js
      - name: Core planner and release syntax
        run: |
          node --check ready-planner-v01.js
          node --check app.js
          node tests/shared-runtime-contract.test.js
      - name: Install browser test dependency
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static preview (localhost only)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ready-evening-http.log 2>&1 &
      - name: Verify quickstart and original planner flow
        run: npx playwright test tests/evening-quickstart.spec.js tests/planner-ui.spec.js tests/runtime-flow.spec.js --reporter=line --workers=1
