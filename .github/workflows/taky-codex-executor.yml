            --run-id "$GITHUB_RUN_ID" \
            --out-dir /tmp/taky-context
      - id: meta
        name: Export task metadata
        run: |
          echo "has_task=$(jq -r '.has_task // false' /tmp/taky-context/prepare.json)" >> "$GITHUB_OUTPUT"
          echo "issue_number=$(jq -r '.issue_number // empty' /tmp/taky-context/prepare.json)" >> "$GITHUB_OUTPUT"
          echo "task_id=$(jq -r '.task_id // empty' /tmp/taky-context/prepare.json)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r '.base_sha // empty' /tmp/taky-context/prepare.json)" >> "$GITHUB_OUTPUT"
          echo "contract_hash=$(jq -r '.contract_hash // empty' /tmp/taky-context/prepare.json)" >> "$GITHUB_OUTPUT"
      - name: Post executor receipt
        if: steps.meta.outputs.has_task == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.meta.outputs.issue_number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file /tmp/taky-context/receipt.md
      - name: Upload verified task context
        if: steps.meta.outputs.has_task == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: taky-task-context-${{ github.run_id }}
          path: |
            /tmp/taky-context/task.json
            /tmp/taky-context/prompt.md
          if-no-files-found: error
          retention-days: 1

  codex:
    needs: [credential_gate, prepare]
    if: needs.credential_gate.outputs.available == 'true' && needs.prepare.outputs.has_task == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: taky-task-context-${{ github.run_id }}
          path: .taky
      - name: Run Codex implementation
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .taky/prompt.md
          output-file: .taky/codex-output.md
          sandbox: workspace-write
          codex-args: '["--ephemeral"]'
      - name: Capture patch and trusted validation
        shell: bash
        run: |
          git diff --binary -- . ':!.taky' > .taky/codex.patch
          git diff --name-only -- . ':!.taky' > .taky/changed-files.txt
          set +e
          python .github/scripts/taky_ready_validation.py \
            --task .taky/task.json \
            --changed-files .taky/changed-files.txt \
            --output .taky/validation.json
          echo "$?" > .taky/validation-exit.txt
          set -e
      - name: Upload Codex work product
        uses: actions/upload-artifact@v4
        with:
          name: taky-codex-work-${{ github.run_id }}
          path: |
            .taky/task.json
            .taky/prompt.md
            .taky/codex-output.md
            .taky/codex.patch
            .taky/changed-files.txt
            .taky/validation.json
            .taky/validation-exit.txt
          if-no-files-found: error
          retention-days: 1

  materialize:
    needs: [prepare, codex]
    if: always() && needs.prepare.outputs.has_task == 'true' && needs.codex.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: taky-codex-work-${{ github.run_id }}
