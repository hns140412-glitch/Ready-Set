name: Ready Runtime E2E

on:
  push:
    branches:
      - main
      - taky/runtime-e2e-0131929
      - taky/ready-integration-v01
      - taky/unit-mapping-table-full-v02
  pull_request:
    branches:
      - main

jobs:
  chromium-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate app Scene Policy adapter
        run: node tests/scene-policy-adapter.spec.js
      - name: Validate character Runtime adapter
        run: node tests/character-runtime-adapter.spec.js
      - name: Validate character Scene event bridge
        run: node tests/character-scene-bridge.spec.js
      - name: Validate character Binding registry
        run: node tests/character-binding-registry.spec.js
      - name: Validate character Binding selector integrity
        run: node tests/character-binding-selector-integrity.spec.js
      - name: Validate character UI Binding planner
        run: node tests/character-ui-binding-planner.spec.js
      - name: Validate character UI Binding event bridge
        run: node tests/character-ui-binding-bridge.spec.js
      - name: Validate fail-closed character DOM binder
        run: node tests/character-dom-binder.spec.js
      - name: Validate approved asset resolver
        run: node tests/approved-asset-resolver.spec.js
      - name: Validate staged character registry activation
        run: node tests/character-registry-state.spec.js
      - name: Validate character contract version declaration
        run: node tests/character-contract-versions.spec.js
      - name: Validate surface Scene Policy
        run: node tests/surface-scene-policy.spec.js
      - name: Validate live Crew semantic runtime
        run: node tests/live-crew-semantic-runtime.spec.js
      - name: Validate live Crew event chain
        run: node tests/live-crew-event-chain.spec.js
      - name: Validate Crew evidence runtime
        run: node tests/crew-evidence-runtime.spec.js
      - name: Pre-Gate JavaScript syntax check
        run: |
          node --check app.js
          node --check ready-crew-live-runtime-v1.js
          node --check ready-crew-dialogue-consumer-v1.js
          node --check ready-character-runtime-adapter-v1.js
          node --check ready-character-scene-bridge-v1.js
          node --check ready-character-ui-binding-bridge-v1.js
      - name: Validate TAKY Design Gate authority
        run: node tools/validate-design-gate.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate shared runtime contract
        run: node tests/shared-runtime-contract.test.js
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/readyset-http.log 2>&1 &
          echo $! > /tmp/readyset-http.pid
      - name: Run runtime flow
        run: npx playwright test tests/*.spec.js --reporter=line
      - name: Install visual comparison dependency
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Compare runtime renders to approved Golden references
        run: python3 tools/compare-golden.py
      - name: Issue Design Gate receipt
        run: python3 tools/issue-design-gate-receipt.py --app READY_SET --interaction-pass --responsive-pass --asset-integrity-pass
      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-set-ui-audit
          path: ui-audit/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Package verified deploy source
        if: success()
        run: |
          git archive --format=zip --output=/tmp/ready-set-deploy-source.zip HEAD
      - name: Upload verified deploy source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ready-set-deploy-source
          path: /tmp/ready-set-deploy-source.zip
          if-no-files-found: error
          retention-days: 3
