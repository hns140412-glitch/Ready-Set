name: Ready Runtime E2E

on:
  push:
    branches:
      - main
      - taky/runtime-e2e-0131929
      - taky/ready-integration-v01
      - taky/unit-mapping-table-full-v02
      - taky/ready-rebuild-v01-2026-09-21
      - taky/ready-character-intro-integration-2026-09-24
  pull_request:
    branches:
      - main

jobs:
  chromium-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build browser Identity runtime
        run: npm run build:auth
      - name: Validate shared runtime contract
        run: node tests/shared-runtime-contract.test.js
      - name: Validate release archive boundary
        run: node tests/release-package-contract.test.js
      - name: Validate Character Intro to Planner integration
        run: node tests/character-intro-integration-contract.test.js
      - name: Validate Ready answer-key verification producer
        run: node tests/answer-key-verifier.test.js
      - name: Validate independent Learning Engine adapter v2
        run: node tests/learning-engine-adapter-v2.test.js
      - name: Validate durable central evidence outbox
        run: node tests/central-evidence-outbox.test.js
      - name: Validate fail-safe central evidence sync
        run: node tests/central-evidence-sync-runtime.test.js
      - name: Validate learning evidence HTTP transport
        run: node tests/central-evidence-http-transport.test.js
      - name: Validate learning evidence family resolver
        run: node tests/learning-evidence-family-resolver.test.js
      - name: Validate learning evidence transport provenance
        run: node tests/learning-evidence-transport-provenance.test.js
      - name: Validate learning evidence endpoint contract
        run: node tests/learning-evidence-endpoint-contract.test.js
      - name: Validate legacy Ready learning compatibility isolation
        run: node tests/legacy-ready-learning-compat.test.js
      - name: Validate Google Account FamilyMembership contract
        run: node tests/google-family-membership-contract.test.js
      - name: Validate Google OAuth browser integration
        run: node tests/google-oauth-browser-integration-contract.test.js
      - name: Validate FamilyMembership onboarding contract
        run: node tests/family-membership-onboarding-contract.test.js
      - name: Validate exact-source specialist deployment receipt gate
        run: node tests/specialist-deployment-receipt-gate.test.js
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/readyset-http.log 2>&1 &
          echo $! > /tmp/readyset-http.pid
      - name: Run runtime flow
        run: npx playwright test tests/*.spec.js --reporter=line
      - name: Upload UI audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-set-ui-audit
          path: ui-audit/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Package verified deploy source
        if: success()
        run: |
          git archive --format=zip --output=/tmp/ready-set-deploy-source.zip HEAD
      - name: Upload verified deploy source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ready-set-deploy-source
          path: /tmp/ready-set-deploy-source.zip
          if-no-files-found: error
          retention-days: 3
