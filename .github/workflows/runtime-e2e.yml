name: Ready Runtime E2E

on:
  push:
    branches:
      - taky/runtime-e2e-0131929
  pull_request:
    branches:
      - main

jobs:
  chromium-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static app
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/readyset-http.log 2>&1 &
          echo $! > /tmp/readyset-http.pid
      - name: Run runtime flow
        run: npx playwright test tests/runtime-flow.spec.js --reporter=line
