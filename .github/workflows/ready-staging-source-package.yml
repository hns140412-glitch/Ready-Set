name: Ready Staging Source Package

on:
  workflow_dispatch:
  push:
    branches:
      - taky/exploration-journey-2026-09-18
    paths:
      - '.github/workflows/ready-staging-source-package.yml'
      - 'VERSION.json'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'styles.css'
      - 'assets/**'
      - 'ready-*.js'
      - 'netlify/**'
      - 'netlify.toml'
      - 'tests/ready-exploration-journey-contract.mjs'
      - 'tests/ready-exploration-journey-e2e.mjs'
      - 'tests/ready-first-run-parent-activation-contract.mjs'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/ready-exploration-journey-contract.mjs
          node tests/ready-first-run-parent-activation-contract.mjs

      - name: Package exact staging tree with trace manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ready-set-staging"
          mkdir -p "$ROOT/site"

          git archive --format=tar "$SOURCE_SHA" | tar -xf - -C "$ROOT/site"

          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ready-set-staging"
          site = root / "site"
          version = json.loads((site / "VERSION.json").read_text(encoding="utf-8"))
          manifest = {
              "product": "Ready & Set",
              "sourceRepository": "hns140412-glitch/Ready-Set",
              "sourceBranch": os.environ["SOURCE_REF"],
              "sourceCommit": os.environ["SOURCE_SHA"],
              "githubRunId": os.environ["RUN_ID"],
              "appVersion": version.get("appVersion"),
              "cacheVersion": version.get("cacheVersion"),
              "releaseStatus": version.get("releaseStatus"),
              "artifactPurpose": "NON_PRODUCTION_STAGING_DEVICE_VALIDATION",
          }
          text = json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          (site / "STAGING_SOURCE_MANIFEST.json").write_text(text, encoding="utf-8")
          (root / "STAGING_SOURCE_MANIFEST.json").write_text(text, encoding="utf-8")
          PY

          (
            cd "$ROOT/site"
            zip -qr "$RUNNER_TEMP/ready-set-staging-site.zip" .
          )

          sha256sum "$RUNNER_TEMP/ready-set-staging-site.zip" > "$RUNNER_TEMP/ready-set-staging-site.sha256"

      - name: Upload exact staging package
        uses: actions/upload-artifact@v4
        with:
          name: ready-set-staging-site
          path: |
            ${{ runner.temp }}/ready-set-staging-site.zip
            ${{ runner.temp }}/ready-set-staging-site.sha256
            ${{ runner.temp }}/ready-set-staging/STAGING_SOURCE_MANIFEST.json
          retention-days: 3
          if-no-files-found: error
