name: Ready layered share-settings UI bounded validation
on:
  push:
    branches:
      - fix/share-ui-layered-binding-20260929
  workflow_dispatch:
permissions:
  contents: read
jobs:
  share-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source parse and read-only data contract
        run: |
          node --check app.js
          node --check src/share/share-golden-truth-runtime.js
          node --check src/share/share-visual-asset-registry-runtime.js
          node --check src/views/share-card-runtime.js
          node --check src/views/share-settings-runtime.js
          node tests/share-golden-truth.test.js
      - name: Browser
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve readonly preview
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/share-ui.log 2>&1 &
      - name: Verify real DOM and consent/variant controls
        run: npx playwright test tests/share-settings-screen.spec.js --reporter=line --workers=1
