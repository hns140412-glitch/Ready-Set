name: Ready native share Golden bounded validation
on:
  push:
    branches:
      - fix/share-golden-truth-binding-20260928
  workflow_dispatch:
permissions:
  contents: read
jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contract and syntax
        run: |
          node --check app.js
          node --check src/share/share-golden-truth-runtime.js
          node --check src/views/share-card-runtime.js
          node --check src/views/profile-controller-runtime.js
          node --check src/views/profile-settings-view-runtime.js
          node tests/share-golden-truth.test.js
      - name: Install isolated browser test environment
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve isolated localhost preview
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ready-share.log 2>&1 &
      - name: Run actual DOM image and native share tests
        run: npx playwright test tests/share-golden-native.spec.js tests/focus-recording-contract.spec.js --workers=1 --reporter=line
