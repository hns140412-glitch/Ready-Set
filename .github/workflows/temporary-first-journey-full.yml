name: Ready First Journey Browser Gate
on:
  push:
    branches: [runtime-session-bridge-2026-09-10]
    paths:
      - '.github/workflows/temporary-first-journey-full.yml'
      - 'index.html'
      - 'ready-onboarding-*.js'
      - 'ready-character-*.js'
      - 'ready-role-context-v1.js'
      - 'ready-parent-setup-hub-v1.js'
      - 'ready-parent-capture-intake-v1.js'
      - 'ready-homework-analysis-bridge-v1.js'
      - 'ready-schedule-base-v1.js'
      - 'ready-foundation-v1.js'
      - 'ready-foundation-control-v1.js'
      - 'ready-stage-g14-planner-authority.js'
      - 'tests/ready-first-journey-*.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-first-journey-full.yml'
      - 'index.html'
      - 'ready-onboarding-*.js'
      - 'ready-character-*.js'
      - 'ready-role-context-v1.js'
      - 'ready-parent-setup-hub-v1.js'
      - 'ready-parent-capture-intake-v1.js'
      - 'ready-homework-analysis-bridge-v1.js'
      - 'ready-schedule-base-v1.js'
      - 'ready-foundation-v1.js'
      - 'ready-foundation-control-v1.js'
      - 'ready-stage-g14-planner-authority.js'
      - 'tests/ready-first-journey-*.mjs'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Package exact staging source
        run: git archive --format=zip HEAD -o "$RUNNER_TEMP/ready-set-staging-source.zip"
      - name: Upload exact staging source
        uses: actions/upload-artifact@v4
        with:
          name: ready-set-staging-source
          path: ${{ runner.temp }}/ready-set-staging-source.zip
          retention-days: 1
          if-no-files-found: error
      - name: Package Netlify deploy runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/netlify-mcp-runtime"
          npm install --prefix "$RUNNER_TEMP/netlify-mcp-runtime" --omit=dev @netlify/mcp@1.15.1
          tar -czf "$RUNNER_TEMP/netlify-mcp-runtime.tgz" -C "$RUNNER_TEMP/netlify-mcp-runtime" .
      - name: Upload Netlify deploy runtime
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runtime
          path: ${{ runner.temp }}/netlify-mcp-runtime.tgz
          retention-days: 1
          if-no-files-found: error
      - name: Install Playwright package only
        run: npm install --no-save playwright@latest
      - name: Run bounded First Journey browser gates
        shell: bash
        run: |
          echo "gate revision 12"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          timeout 150s node tests/ready-first-journey-transition.mjs "$PWD/node_modules/playwright/index.mjs" "$CHROME"
          timeout 180s node tests/ready-first-journey-parent-home.mjs "$PWD/node_modules/playwright/index.mjs" "$CHROME"
