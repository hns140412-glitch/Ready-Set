name: Temporary first journey full browser gate
on:
  push:
    branches: [runtime-session-bridge-2026-09-10]
    paths: ['.github/workflows/temporary-first-journey-full.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-session-bridge-2026-09-10
      - name: Install Playwright package only
        run: npm install --no-save playwright@latest
      - name: Run bounded First Journey browser gates
        shell: bash
        run: |
          echo "gate revision 7"
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          timeout 150s node tests/ready-first-journey-transition.mjs "$PWD/node_modules/playwright/index.mjs" "$CHROME"
          timeout 180s node tests/ready-first-journey-parent-home.mjs "$PWD/node_modules/playwright/index.mjs" "$CHROME"
