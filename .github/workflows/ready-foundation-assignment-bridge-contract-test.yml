name: Ready Foundation Assignment Bridge Contract

on:
  push:
    branches:
      - runtime-session-bridge-2026-09-10
    paths:
      - 'ready-foundation-v1.js'
      - 'ready-foundation-control-v1.js'
      - 'ready-stage-e.js'
      - 'ready-stage-f.js'
      - 'ready-stage-g1-fix.js'
      - 'tests/ready-foundation-assignment-bridge-contract.mjs'
      - 'tests/ready-foundation-assignment-bridge-execution.mjs'
      - '.github/workflows/ready-foundation-assignment-bridge-contract-test.yml'
  pull_request:
    paths:
      - 'ready-foundation-v1.js'
      - 'ready-foundation-control-v1.js'
      - 'ready-stage-e.js'
      - 'ready-stage-f.js'
      - 'ready-stage-g1-fix.js'
      - 'tests/ready-foundation-assignment-bridge-contract.mjs'
      - 'tests/ready-foundation-assignment-bridge-execution.mjs'
      - '.github/workflows/ready-foundation-assignment-bridge-contract-test.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Foundation bridge
        run: node --check ready-foundation-control-v1.js
      - name: Foundation assignment bridge contract
        run: node tests/ready-foundation-assignment-bridge-contract.mjs
      - name: Execute Foundation assignment bridge
        run: node tests/ready-foundation-assignment-bridge-execution.mjs
