name: Apply PHOTO advance hotfix

on:
  push:
    branches: [runtime-session-bridge-2026-09-10]
    paths: ['.github/workflows/apply-photo-advance-hotfix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-session-bridge-2026-09-10
          fetch-depth: 0
      - name: Patch identity owners
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['ready-onboarding-identity-v1.js','ready-onboarding-identity-v2.js']
          anchor="window.addEventListener('pageshow',recover);"
          bridge=r'''
// Stable mobile activation bridge: preserve the native tap, then advance after the event finishes.
let photoAdvancePending=false;
function delegatePhotoAdvance(event){
 const target=event.target?.closest?.('#readyFirstRun #next');
 if(!target||target.disabled)return;
 const i=identity();
 if(i.onboardingStep!=='PHOTO'||!i.sourcePhoto||photoAdvancePending)return;
 photoAdvancePending=true;
 setTimeout(()=>{
   photoAdvancePending=false;
   if(identity().onboardingStep==='PHOTO')transitionToCharacter();
 },0);
}
document.addEventListener('touchend',delegatePhotoAdvance,true);
document.addEventListener('click',delegatePhotoAdvance,true);
'''
          for name in files:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              if 'delegatePhotoAdvance' not in s:
                  if anchor not in s:
                      raise SystemExit(f'anchor missing: {name}')
                  s=s.replace(anchor,anchor+'\n'+bridge,1)
              s=s.replace("2026.09.13-onboarding-identity-v11-deferred","2026.09.13-onboarding-identity-v12-mobile-advance")
              p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax and owner parity
        run: |
          node --check ready-onboarding-identity-v1.js
          node --check ready-onboarding-identity-v2.js
          cmp ready-onboarding-identity-v1.js ready-onboarding-identity-v2.js
          grep -q "delegatePhotoAdvance" ready-onboarding-identity-v1.js
      - name: Commit actual branch change
        run: |
          git config user.name "TAKY Actions"
          git config user.email "actions@users.noreply.github.com"
          git add ready-onboarding-identity-v1.js ready-onboarding-identity-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize mobile PHOTO advance activation"
          git push origin HEAD:runtime-session-bridge-2026-09-10
