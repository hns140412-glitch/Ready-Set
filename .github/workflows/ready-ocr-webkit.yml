name: Ready OCR WebKit Capture Gate

on:
  pull_request:
    branches: [main]
    paths:
      - app.js
      - index.html
      - ready-capture-v01.js
      - ready-capture-analysis-adapter-v01.js
      - tests/ios-capture-path.spec.js
      - .github/workflows/ready-ocr-webkit.yml

permissions:
  contents: read

jobs:
  webkit-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps webkit
      - name: Serve local static app (no provider or deployment)
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ready-ocr-webkit-http.log 2>&1 &
      - name: Simulate mobile WebKit capture and gallery inputs
        run: npx playwright test tests/ios-capture-path.spec.js --browser=webkit --reporter=line
