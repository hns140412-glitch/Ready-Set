name: Temporary first journey error source
on:
  push:
    branches: [runtime-session-bridge-2026-09-10]
    paths: ['.github/workflows/temporary-first-journey-error-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime-session-bridge-2026-09-10
      - run: npm install --no-save playwright@latest
      - name: Locate browser exceptions
        shell: bash
        run: |
          cat > /tmp/locate.mjs <<'EOF'
          import {pathToFileURL} from 'node:url';
          const root=process.cwd();
          const {createServer}=await import(pathToFileURL(`${root}/tests/visual-qa/server.mjs`).href);
          const {chromium}=await import(pathToFileURL(`${root}/node_modules/playwright/index.mjs`).href);
          const server=createServer(); await new Promise(r=>server.listen(4177,'127.0.0.1',r));
          let browser;
          try{
            browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,timeout:15000});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,serviceWorkers:'block'});
            await context.route('**/*',route=>{const u=new URL(route.request().url());return (u.origin!=='http://127.0.0.1:4177'||u.pathname.startsWith('/api/'))?route.abort():route.continue();});
            const page=await context.newPage();
            const cdp=await context.newCDPSession(page); await cdp.send('Runtime.enable');
            cdp.on('Runtime.exceptionThrown',({exceptionDetails:d})=>console.log('CDP_EXCEPTION='+JSON.stringify({text:d.text,url:d.url,line:d.lineNumber+1,column:d.columnNumber+1,description:d.exception?.description||'',stack:d.stackTrace?.callFrames?.slice(0,4)||[]})));
            page.on('pageerror',e=>console.log('PAGE_ERROR='+JSON.stringify({message:e.message,stack:e.stack||''})));
            await page.goto('http://127.0.0.1:4177/__visual/?state=onboarding-photo',{waitUntil:'load',timeout:15000});
            await page.waitForTimeout(1200);
            await page.locator('#gal').setInputFiles({name:'fixture.png',mimeType:'image/png',buffer:Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jRZkAAAAASUVORK5CYII=','base64')});
            await page.waitForFunction(()=>!document.querySelector('#readyFirstRun #next')?.disabled,{timeout:10000});
            await page.locator('#readyFirstRun #next').tap();
            await page.waitForTimeout(3500);
            console.log('STEP='+await page.evaluate(()=>window.ReadyIdentityV1?.get?.().onboardingStep||null));
            await context.close();
          } finally {await browser?.close();await new Promise(r=>server.close(r));}
          EOF
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          CHROME="$CHROME" timeout 70s node /tmp/locate.mjs
