name: Export Ready staging source

on:
  push:
    branches:
      - ready-staging-fixed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: ready-staging-source
          path: .
          include-hidden-files: true
          retention-days: 1
