<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#203f86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ready & Set">
<title>Ready &amp; Set</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gamja+Flower&family=Jua&family=Montserrat:wght@700;800&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="rs/rs.css?v=20261111c">
</head>
<body>
<div id="app" aria-live="polite"></div>
<div id="toast" role="status"></div>
<section id="takyFamilySheet" class="taky-sheet" hidden role="dialog" aria-modal="true" aria-label="가족 탐험대 합류">
  <div class="taky-sheet__panel">
    <button class="taky-sheet__x" type="button" data-taky-close aria-label="닫기">×</button>
    <h2>가족 탐험대 합류</h2>
    <p class="taky-sheet__lead">합류하면 내 사진이 탐험본부로 날아가요. 본부가 그 사진으로 나만의 탐험가 카드를 그려서 다시 보내 줘요.</p>
    <div id="familyLogin">
      <button id="familySignInBtn" class="taky-sheet__btn" type="button" disabled>Google로 탐험대 합류</button>
      <div id="familyGoogleTarget"></div>
      <div id="familyChooseTarget"></div>
      <p id="familyLoginStatus" role="status">탐험대 명단은 탐험본부가 확인해요.</p>
      <button id="familySignOutBtn" class="taky-sheet__btn ghost" type="button" hidden>잠시 캠프 떠나기</button>
    </div>
  </div>
</section>
<script src="rs/crew.js?v=20261111c"></script>
<script src="rs/rs-taky-character-sync.js?v=20261111c"></script>
<script src="rs/rs-app.js?v=20261111c"></script>
<script type="module" src="rs/rs-taky-family.mjs?v=20261111c"></script>
</body>
</html>
